server:
  port: 8080

spring:
  application:
    name: api-server

  # 외부 로컬 환경에 구축된 MySQL에 접속한다 (컨테이너화하지 않음).
  # DB_HOST/DB_PORT 등은 .env 파일(compose의 env_file)로 주입된다.
  datasource:
    # allowPublicKeyRetrieval=true (2026-10-06, T-11 장애 원인): MySQL 8 기본 인증(caching_sha2_password)은
    # 서버의 인증 캐시가 비어 있을 때(MySQL 재시작 직후 등) 비밀번호를 RSA 공개키로 암호화해 보내야 하는데,
    # useSSL=false에서는 Connector/J가 공개키 요청을 기본으로 막아 새 연결이 전부
    # "Public Key Retrieval is not allowed"로 실패했다. 테스트 LAN 환경이라 허용한다.
    # 운영(신뢰할 수 없는 네트워크)에서는 대신 sslMode=REQUIRED로 TLS 연결을 쓴다.
    # serverTimezone=Asia/Seoul (D-20, 2026-10-07 KST 통일 결정): Instant를 DATETIME에 쓸 때·읽을 때
    # 한국 시각으로 변환한다 → DB의 일시 컬럼은 KST. 컨테이너(JVM) 시간대와 상관없이 이 값이 기준이다.
    # 시각 비교는 DB 함수(NOW()/UTC_TIMESTAMP()) 대신 서버가 계산한 값을 바인딩한다(CepJdbcRepository 참고).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:posture_app}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USER:posture_app}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # DB가 아직 안 떠 있어도 애플리케이션 컨텍스트 시작은 막지 않는다.
      # (연결 재시도는 /actuator/health 가 계속 감시)
      initialization-fail-timeout: -1
      connection-timeout: 5000
      # (D-15) 동시에 DB를 쓰는 주체: posture.inference 컨슈머 스레드(기본 3)
      # + 세션 만료 스케줄러(1) + 헬스체크(1) = 5. 여유를 두어 8.
      # 컨슈머 concurrency를 올리면 이 값도 함께 올린다(DB max_connections=151).
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      # (D-11) 기본값에 기대지 않고 커넥션 수명 관련 값을 명시한다.
      pool-name: posture-app-pool
      # 커넥션 최대 수명 30분 — DB의 wait_timeout(기본 8시간)보다 반드시 짧게.
      # DB가 먼저 끊은 커넥션을 풀이 꺼내 쓰다 실패하는 일을 막는다.
      max-lifetime: 1800000
      # 유휴 커넥션에 5분마다 가벼운 ping — 공유기/방화벽이 오래 놀던 TCP
      # 연결을 조용히 끊는 경우를 대비. max-lifetime보다 짧아야 한다.
      keepalive-time: 300000
      # 커넥션 유효성 검사 대기 상한 (connection-timeout보다 짧게)
      validation-timeout: 3000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 단일 브로커(KRaft) 테스트 환경 기준. 컨트롤러가 죽지 않는 한 재시도로 충분.
      acks: all
      retries: 3
    consumer:
      # posture-cep(Python)이 쓰던 설정과 동일하게 맞춘다 — PostureInferenceConsumer
      # (D-13)가 posture.inference를 구독한다. 테스트 단계라 earliest 유지.
      group-id: ${POSTURE_INFERENCE_CONSUMER_GROUP:api-server-cep}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# 애플리케이션 자체 설정 (posture 도메인)
app:
  kafka:
    topic:
      posture-summary: ${POSTURE_SUMMARY_TOPIC:posture.summary}
      posture-inference: ${POSTURE_INFERENCE_TOPIC:posture.inference}
      posture-features-v1: ${POSTURE_FEATURES_V1_TOPIC:posture.features.v1}
      posture-inference-v1: ${POSTURE_INFERENCE_V1_TOPIC:posture.inference.v1}
      posture-episodes-v1: ${POSTURE_EPISODES_V1_TOPIC:posture.episodes.v1}
      # (D-36) 처리 못 한 메시지
      posture-dlq: ${POSTURE_DLQ_TOPIC:posture.dlq}
    # (D-15) posture.inference 컨슈머 스레드 수 = 토픽 파티션 수와 맞출 것
    posture-inference-concurrency: ${POSTURE_INFERENCE_CONCURRENCY:3}
    # (D-21) 실시간 계약 v1 토픽 — 키 session_id, 파티션 수는 위 concurrency와 맞춘다
    realtime-partitions: ${REALTIME_TOPIC_PARTITIONS:3}
    posture-inference-v1-group: ${POSTURE_INFERENCE_V1_CONSUMER_GROUP:api-server-cep-v1}
  # (D-21) 시험용 입구 POST /api/v1/realtime/features — 최종 입구는 팀 입구 API·게이트웨이
  realtime:
    test-entry:
      enabled: ${REALTIME_TEST_ENTRY_ENABLED:true}

# posture-cep(Python) 상태머신을 이식하면서 그대로 옮긴 파라미터
# (2026-10-02 아키텍처 v4 전환 결정, D-13). 값은 VM에서 이미 검증된
# 지속(3s)/회복(3s)/재알림(60s)을 잠정 유지 — 팀 회의에서 다른 값으로
# 확정되면 그때 바꾼다(아키텍처_v4_검토의견_2026-10-02.md 참고).
cep:
  persist-seconds: ${CEP_PERSIST_SECONDS:3}
  recovery-seconds: ${CEP_RECOVERY_SECONDS:3}
  realert-seconds: ${CEP_REALERT_SECONDS:60}
  session-timeout-seconds: ${CEP_SESSION_TIMEOUT_SECONDS:300}
  session-expiry-interval-seconds: ${CEP_SESSION_EXPIRY_INTERVAL_SECONDS:60}
  # (D-21) v1 관측의 붕괴 후보 기준(점수 ≥ 이 값이면 BAD). 세션 정책(policy.threshold) 적용은 D-23
  collapse-threshold: ${CEP_COLLAPSE_THRESHOLD:0.7}
  # (D-04) 상태머신 상태를 Redis posture:state:{sessionId}(Hash)에 저장해 api-server
  # 재시작 후에도 진행 중이던 판정을 이어간다. 키 TTL은 v4 설계(5.9절)대로 1시간.
  # false면 기존처럼 메모리에만 둔다(Redis 장애 시에도 판정은 메모리로 계속됨).
  # (D-16) /cep/events/recent 조회용으로 메모리에 남겨둘 최근 종료 이벤트 수
  recent-events-capacity: ${CEP_RECENT_EVENTS_CAPACITY:1000}
  # (D-18) DB 쓰기를 판정 경로에서 분리한 쓰기 버퍼. 컨슈머는 메모리에만 넘기고,
  # 별도 스레드가 flush-interval-ms마다 묶어서 쓴다. DB 실패 시 기록을 보관하고
  # 1초→2초→…→max-backoff-ms 간격으로 재시도. 이벤트 보관 한도를 넘으면 오래된 것부터 버린다.
  db-writer:
    flush-interval-ms: ${CEP_DB_WRITER_FLUSH_INTERVAL_MS:1000}
    event-capacity: ${CEP_DB_WRITER_EVENT_CAPACITY:10000}
    max-backoff-ms: ${CEP_DB_WRITER_MAX_BACKOFF_MS:30000}
  state-store:
    enabled: ${CEP_STATE_STORE_ENABLED:true}
    ttl-seconds: ${CEP_STATE_TTL_SECONDS:3600}
  # (D-37) v1 판정기 상태를 Redis posture:v1:judge:{session_id}(JSON 문자열, TTL = state-store.ttl-seconds)에 저장해
  # api-server 재시작 뒤 진행 중 세션의 판정(누적 시간·진행 중 사건·event_id·요약)을 이어간다. false면 메모리에만 둔다.
  v1-state-store:
    enabled: ${CEP_V1_STATE_STORE_ENABLED:true}

# (D-32) 확정 서비스 DB — DB 명세서 V2.1 `posture_service`. 테스트용 posture_app과 같은 MySQL 서버에 있어
# 연결 풀을 따로 두지 않고 스키마 이름을 붙여 쓴다(같은 계정에 posture_service.* SELECT·INSERT·UPDATE·DELETE 필요).
# 지금은 준비 확인(GET /cep/service-db)만 한다. 판정 결과 저장은 D-30.
service-db:
  enabled: ${SERVICE_DB_ENABLED:true}
  schema: ${SERVICE_DB_SCHEMA:posture_service}
  # 시드 seed_04의 기본 판정 정책 이름. 확정 정책(DEFAULT) 행이 생기면 이 값만 바꾼다.
  default-policy-name: ${SERVICE_DB_DEFAULT_POLICY:DEFAULT_TEMP}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      # 세 구성요소(db/redis/kafka) 각각의 상태를 개별적으로 노출한다.
      probes:
        enabled: true
      # (D-11) 헬스 그룹 분리
      #  - liveness  (/actuator/health/liveness):  "프로세스가 살아있나"만 본다.
      #    컨테이너 헬스체크(docker-compose)와 향후 K8s livenessProbe가 쓴다.
      #    외부 DB가 잠깐 끊겨도 컨테이너가 unhealthy/재시작되지 않게 하려는 것.
      #  - readiness (/actuator/health/readiness): 트래픽을 받아도 되나 — DB/Redis
      #    의존성까지 포함. 향후 K8s readinessProbe용.
      #  - 전체(/actuator/health)는 지금처럼 모든 구성요소 상세를 보는 모니터링용.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    db:
      enabled: true
    redis:
      enabled: true
    kafka:
      enabled: true
