<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>페이지를 찾을 수 없어요 · PoseGood</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --ink: #202b33; --muted: #5c6670; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; background: var(--bg); color: var(--ink); font-family: Pretendard, 'Malgun Gothic', system-ui, sans-serif; text-align: center; }
    main { width: min(100%, 480px); }
    img { width: min(100%, 340px); height: 255px; object-fit: contain; }
    h1 { margin: 8px 0 12px; font-size: clamp(22px, 4vw, 28px); line-height: 1.4; }
    p { color: var(--muted); line-height: 1.6; }
    .code { font-size: 13px; margin-top: 24px; }
    a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 16px; padding: 10px 20px; border-radius: 11px; background: var(--accent, #18794e); color: var(--on-accent, #fff); text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 2px solid var(--accent, #18794e); outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { :root { --bg: #181a1d; --ink: #f3f4f5; --muted: #b6bbc2; } }
  </style>
</head>
<body><main>
  <img data-error-code="404" src="/illustrations/themes/green-error-404.webp" width="400" height="300" alt="" />
  <p class="code">오류 404</p>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소를 확인하거나 홈으로 돌아가 주세요.</p>
  <a href="/">홈으로 돌아가기</a>
</main><script src="/error-theme.js"></script></body>
</html>
