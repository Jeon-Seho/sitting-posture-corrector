# CodeQL 보안 분석: 주간 예약으로 실행
name: CodeQL CI

on:
  schedule:
    # 매주 월요일 00:00 KST = 매주 일요일 15:00 UTC
    - cron: '0 15 * * 0'

jobs:
  analyze:
    name: CodeQL 분석 (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: CodeQL 초기화
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: CodeQL 분석
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
