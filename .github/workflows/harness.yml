name: Repository harness

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  face-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r model/analysis/requirements-relative-lab.txt --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.5.3
      - run: python model/analysis/train_face_motion.py --epochs 5 --min-epochs 5 --takes 1
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run test -- src/features/face-lab/model.test.ts --maxWorkers=2
      - run: npm --prefix frontend run face:build
  relative-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r model/analysis/requirements-relative-lab.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python model/analysis/train_relative_lab.py --epochs 5 --min-epochs 5 --takes 12
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run test -- src/features/relative-lab/model.test.ts
      - run: npm --prefix frontend run lab:build
  verify:
    runs-on: ubuntu-latest
    env:
      # Only the disposable CI runner uses this; local Chrome keeps its sandbox.
      POSEGOOD_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: make setup
      - name: Require Docker and Compose for persistent service verification
        run: |
          docker info --format '{{.ServerVersion}}'
          docker compose version
      - run: make check
