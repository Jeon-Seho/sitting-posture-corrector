name: Build and deploy Compose release

on:
  push:
    branches: [main, release]

permissions:
  contents: read

concurrency:
  group: posegood-production-deployment
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/harness.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build commit-tagged images and save digest manifest
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: >-
          python3 tools/deploy_images.py --publish
          --repository "$REPOSITORY" --sha "$COMMIT_SHA"
          --platform linux/amd64,linux/arm64
          --output .cache/release/images.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: .cache/release/images.json
          if-no-files-found: error

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-images
          path: .cache/release
      - name: Verify settings and deploy through pinned SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_DIRECTORY: ${{ vars.DEPLOY_DIRECTORY }}
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYSQL_APP_PASSWORD: ${{ secrets.MYSQL_APP_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          POSEGOOD_INTERNAL_TOKEN: ${{ secrets.POSEGOOD_INTERNAL_TOKEN }}
        run: python3 tools/deploy_ssh.py --manifest .cache/release/images.json
