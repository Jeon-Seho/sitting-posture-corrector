name: Backend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Backend compile and Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle
            backend/**/gradle.properties
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Compile and check code rules
        run: >-
          ./gradlew --no-daemon --console=plain
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :api:compileJava
          :processing:compileJava
          :api:checkstyleMain
          :processing:checkstyleMain