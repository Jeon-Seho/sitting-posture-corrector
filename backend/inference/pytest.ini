[pytest]
# app/ 은 __init__.py가 없는 네임스페이스 패키지라, pytest가 이 파일이
# 있는 디렉토리(inference-service/)를 rootdir이자 import 기준 경로로
# 잡도록 pythonpath를 명시한다. 이게 없으면 "tests/test_consumer.py"에서
# "from app.consumer import ..."가 CI 환경에 따라 실패할 수 있다.
# (계획 0098) 저장소 루트(../..)도 넣어 model.inference(특징 계산·프레임 RF)를 불러온다.
pythonpath = . ../..
testpaths = tests
