plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.posegood'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // RestClient.Builder for the FastAPI inference call (a separate module since Spring Boot 4).
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // Inference v3 over Kafka (posegood.inference.transport=kafka, plan 0064). Boot 4 needs the starter for KafkaTemplate.
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Login: short JWT access tokens (HS256, Bearer) + rotating refresh tokens in the DB (refresh_token, V2.6).
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // In-process Kafka broker for the inference round trip test (no Docker).
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Same artifact as the former Maven build: build/libs/session-api-0.1.0-SNAPSHOT.jar.
tasks.named('bootJar') {
    archiveBaseName = 'session-api'
}
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    // `-Pmysql-integration` runs the tests that need a real, disposable MySQL (see backend/README.md).
    if (project.hasProperty('mysql-integration')) {
        systemProperty 'posegood.mysql.integration', 'true'
        // The database comes from environment variables Gradle does not track: never reuse a result.
        outputs.upToDateWhen { false }
    }
    // `-Pkafka-e2e` also runs the real Python inference worker against the in-process Kafka broker (needs .venv).
    if (project.hasProperty('kafka-e2e')) {
        systemProperty 'posegood.kafka.e2e', 'true'
        outputs.upToDateWhen { false }
    }
}
