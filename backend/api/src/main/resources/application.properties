# Local development defaults. Compose overrides them with environment variables and secrets.
server.address=127.0.0.1
server.port=8090
server.error.include-message=never

# Schema V2.0 is applied from database/ by the DB owner's procedure; the API only verifies it.
# Every DATETIME(3) is KST (CR-04). Values cross JDBC as zone-less LocalDateTime (KstTime);
# connectionTimeZone only affects legacy Timestamp conversions. No MySQL time zone tables are needed.
spring.datasource.url=${POSEGOOD_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/posture_service?connectionTimeZone=Asia/Seoul}
spring.datasource.username=${POSEGOOD_DATABASE_USER:posegood}
spring.datasource.password=${POSEGOOD_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=1

spring.session.jdbc.initialize-schema=never
spring.session.timeout=${POSEGOOD_LOGIN_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${POSEGOOD_COOKIE_SECURE:false}

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.parser.strict-duplicate-detection=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

posegood.inference-url=${POSEGOOD_INFERENCE_URL:http://127.0.0.1:8092}
posegood.internal-hosts-enabled=false
posegood.model-version=reference-feature-rule-v1
posegood.default-policy-name=${POSEGOOD_DEFAULT_POLICY_NAME:DEFAULT_TEMP}
# Comma-separated; empty allows only same-origin pages.
posegood.realtime.allowed-origins=${POSEGOOD_REALTIME_ALLOWED_ORIGINS:}

# Live decision state (ADR 0020).
posegood.live-session-capacity=512
posegood.ended-session-retention=30m
posegood.idle-session-retention=6h

# Withdrawal: 30-day grace (WITHDRAWAL_GRACE_DAY), then one purge transaction per account.
posegood.withdrawal-grace-days=30
posegood.withdrawal-purge-initial-ms=60000
posegood.withdrawal-purge-interval-ms=3600000
