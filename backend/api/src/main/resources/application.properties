# Local development defaults. Compose overrides them with environment variables and secrets.
server.address=127.0.0.1
server.port=8090
server.error.include-message=never

# Schema V2.6 is applied from database/; the API only verifies it.
# Every DATETIME(3) is KST (CR-04). Values cross JDBC as zone-less LocalDateTime (KstTime);
# connectionTimeZone only affects legacy Timestamp conversions. No MySQL time zone tables are needed.
spring.datasource.url=${POSEGOOD_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/posture_service?connectionTimeZone=Asia/Seoul}
spring.datasource.username=${POSEGOOD_DATABASE_USER:posegood}
spring.datasource.password=${POSEGOOD_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=1

# Login (ADR 0031): JWT access token (HS256, Authorization: Bearer, not stored) + rotating refresh token
# (HttpOnly cookie, SHA-256 in refresh_token). The secret must be at least 32 bytes; empty = random per start
# (local development only: every access token dies on restart).
posegood.auth.jwt-secret=${POSEGOOD_JWT_SECRET:}
posegood.auth.access-lifetime=${POSEGOOD_ACCESS_TOKEN_LIFETIME:30m}
posegood.auth.refresh-lifetime=${POSEGOOD_REFRESH_TOKEN_LIFETIME:14d}
# A rotated refresh token still works this long (tabs refreshing at once); later reuse revokes every login.
posegood.auth.refresh-grace=30s
posegood.auth.refresh-cookie-secure=${POSEGOOD_COOKIE_SECURE:false}
# The browser path, not the API path: Nginx and Vite strip /api, so "/" keeps the cookie on /api/v2/auth/*.
posegood.auth.refresh-cookie-path=${POSEGOOD_REFRESH_COOKIE_PATH:/}

# Duplicate keys are rejected in common/JsonConfiguration (Jackson 3 StreamReadFeature).
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

posegood.inference-url=${POSEGOOD_INFERENCE_URL:http://127.0.0.1:8092}
# How coordinate frames reach inference v3 (plan 0084): http = POST /v3/infer per received interval (development,
# tests, Compose), kafka = request/result topics below. Either way the judgement engine collects the results.
posegood.inference.transport=${POSEGOOD_INFERENCE_TRANSPORT:http}
# A result that has not arrived this long after its interval is dropped (missing time) and the app gets stalled.
# end/disconnect/midnight wait this long for results still on the way.
posegood.inference.result-timeout=${POSEGOOD_INFERENCE_RESULT_TIMEOUT:2s}
# Kafka (only with transport=kafka). Key = session_id. One consumer group per API instance: every instance reads all
# results and keeps those of its own sessions; results from before a restart are skipped (latest).
posegood.kafka.request-topic=${POSEGOOD_KAFKA_REQUEST_TOPIC:posture.inference-request.v3}
posegood.kafka.result-topic=${POSEGOOD_KAFKA_RESULT_TOPIC:posture.inference-result.v3}
posegood.kafka.partitions=${POSEGOOD_KAFKA_PARTITIONS:3}
# Requests carry coordinates and Kafka cannot delete per user, so both topics keep messages only briefly.
posegood.kafka.retention=${POSEGOOD_KAFKA_RETENTION:1h}
spring.kafka.admin.modify-topic-configs=true
posegood.kafka.group-id=${POSEGOOD_KAFKA_GROUP_ID:io-api-${HOSTNAME:local}}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
# Realtime: send at once, and never block the WebSocket thread for long when the broker is away.
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.request.timeout.ms=1500
spring.kafka.producer.properties.delivery.timeout.ms=2000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.fetch-max-wait=50ms
posegood.internal-hosts-enabled=false
posegood.model-version=reference-feature-rule-v1
posegood.default-policy.threshold=${POSEGOOD_DEFAULT_THRESHOLD:0.7}
posegood.default-policy.hold-seconds=${POSEGOOD_DEFAULT_HOLD_SECONDS:3}
posegood.default-policy.recover-seconds=${POSEGOOD_DEFAULT_RECOVER_SECONDS:3}
posegood.default-policy.realert-seconds=${POSEGOOD_DEFAULT_REALERT_SECONDS:60}
# Pages on another origin (Vercel https://app.<domain>) allowed to call the REST API with the refresh cookie.
# Comma-separated exact origins (no trailing /, no *); empty = no CORS, same-origin pages only (Nginx, Vite).
posegood.cors.allowed-origins=${POSEGOOD_CORS_ALLOWED_ORIGINS:}
# Comma-separated; empty allows only same-origin pages.
posegood.realtime.allowed-origins=${POSEGOOD_REALTIME_ALLOWED_ORIGINS:}
# /v2/realtime: hello must arrive within hello-timeout (else closed(bad_message)). The app waits 5 s for
# ready (api-ws-spec 1.1); if preparing a measurement takes longer, the server closes with session_lost.
posegood.realtime.hello-timeout=10s
posegood.realtime.ready-timeout=5s
# Longest measurement per session (intervals ending later get 429 / closed(limit_reached)). No product limit
# (2026-10-26): the default is the contract's time bound (*_ms <= 86,400,000 = 24 h). Memory no longer grows
# with the measurement (only the last 120 intervals are kept for retries).
posegood.realtime.max-session-duration=${POSEGOOD_MAX_SESSION_DURATION:24h}
# Unmeasurable (judgement impossible or away) for this long in a row ends and stores the session at that point,
# closed(unmeasurable_timeout). Decided value 30m (2026-10-28, was 5m); the app handles the reason since 10/27. 0s turns it off.
posegood.realtime.unmeasurable-timeout=${POSEGOOD_UNMEASURABLE_TIMEOUT:30m}
# At KST midnight the realtime connection ends the session at its last interval and continues in a new
# server-made session (session_rollover, BE-6 item 1, plan B). Off until the app handles session_rollover.
posegood.realtime.midnight-rollover=${POSEGOOD_MIDNIGHT_ROLLOVER:false}
# Each received coordinate interval goes to inference v3 at once; the judgement engine collects the per-frame
# results and judges them in order every this much server time (plan 0084). rest/away judge at once; end,
# disconnect and midnight wait for results still on the way (inference.result-timeout). Alerts come up to this
# much later. 0s judges every result as it arrives.
posegood.realtime.batch-window=${POSEGOOD_REALTIME_BATCH_WINDOW:3s}

# Live decision state (ADR 0020).
posegood.live-session-capacity=512
posegood.ended-session-retention=30m
posegood.idle-session-retention=6h

# Withdrawal: the API only records it (account CLOSED, no cancel). The 30-day grace
# (WITHDRAWAL_GRACE_DAY) and the final deletion belong to Spark J3 (cron daily 04:00, architecture v5.2).
