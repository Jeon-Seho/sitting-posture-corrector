spring.autoconfigure.exclude=
server.address=0.0.0.0
spring.datasource.url=${POSEGOOD_DATABASE_URL:jdbc:mysql://db:3306/posture_service?connectionTimeZone=UTC}
spring.datasource.username=${POSEGOOD_DATABASE_USER:posegood}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=1
# Schema V1.1 is applied from database/ (DB owner's SQL); the API only verifies it at startup.
posegood.default-policy-name=${POSEGOOD_DEFAULT_POLICY_NAME:DEFAULT_TEMP}
posegood.model-version=reference-feature-rule-v1
posegood.model-version-code=REFERENCE-RULE-1
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${POSEGOOD_LOGIN_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${POSEGOOD_COOKIE_SECURE:false}
posegood.cep-url=${POSEGOOD_CEP_URL:http://cep:8091}
posegood.inference-url=${POSEGOOD_INFERENCE_URL:http://inference:8092}
posegood.internal-hosts-enabled=true
posegood.recovery-delay-ms=1000
