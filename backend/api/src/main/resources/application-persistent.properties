spring.autoconfigure.exclude=
server.address=0.0.0.0
spring.datasource.url=${POSEGOOD_DATABASE_URL:jdbc:mysql://db:3306/posegood?connectionTimeZone=UTC}
spring.datasource.username=${POSEGOOD_DATABASE_USER:posegood}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=1
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${POSEGOOD_LOGIN_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${POSEGOOD_COOKIE_SECURE:false}
posegood.cep-url=${POSEGOOD_CEP_URL:http://cep:8091}
posegood.inference-url=${POSEGOOD_INFERENCE_URL:http://inference:8092}
posegood.internal-hosts-enabled=true
posegood.recovery-delay-ms=1000
