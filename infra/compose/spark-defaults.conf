# spark 컨테이너의 Spark 기본 설정 — compose가 /opt/spark/conf/spark-defaults.conf로 읽기 전용 마운트한다(infra/compose/bigdata.yaml).
# 비밀값을 넣지 않는다(저장소에 커밋되는 파일).
#
# (D-61) HDFS 복제 수 1 — DataNode가 하나뿐인 단일 노드 환경. hadoop.env의 HDFS_CONF_dfs_replication=1은
# HDFS 컨테이너(namenode·datanode)에만 적용되고, Spark는 HDFS 클라이언트 기본값 3으로 파일을 써서
# 복제 부족 블록이 생겼다(10/17 확인: posture-sink·왕복 시험 Parquet 44개). J1~J3(D-33·D-05·D-49)이 이 컨테이너에서 돈다.
spark.hadoop.dfs.replication    1
