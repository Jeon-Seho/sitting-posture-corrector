upstream posegood_api {
    zone posegood_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server api:8090 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Realtime channel (contracts/realtime). The API accepts same-origin pages only, so the
    # original Host with its port is forwarded unchanged.
    # v2 (realtime-ws.v2: coordinate frames, purpose measure/calibration) is the current channel.
    # v1 stays open only until the app has moved to v2, then this location is removed.
    location = /api/v2/realtime {
        proxy_pass http://posegood_api/v2/realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-PoseGood-Internal-Token "";
        proxy_read_timeout 120s;
    }

    location = /api/v1/realtime {
        proxy_pass http://posegood_api/v1/realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-PoseGood-Internal-Token "";
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://posegood_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-PoseGood-Internal-Token "";
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location /mediapipe/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
