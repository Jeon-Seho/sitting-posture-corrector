# (D-43) 인터넷 공개 입구 — API만 받는 nginx(compose 서비스 gateway, infra/compose/bigdata.yaml).
# Cloudflare 터널(cloudflared 컨테이너)만 같은 네트워크에서 http://gateway:80으로 부른다. 호스트 포트는 열지 않는다.
# 화면은 Vercel(https://app.posegood.site)이 낸다 — 여기서는 화면 파일을 내지 않는다(/는 404).
# 서버 안 시험용 web(infra/nginx/default.conf, 127.0.0.1:8088)과 API 부분은 같고, 다른 점:
#   - 화면·/mediapipe/ 없음, 그 밖의 경로 404
#   - X-Forwarded-Proto는 https 고정(터널 밖은 항상 https, 터널 → gateway 구간만 http)
#   - X-Forwarded-For는 Cloudflare가 준 실제 사용자 IP(CF-Connecting-IP). 이 포트는 cloudflared만 닿는다
#   - 옛 /api/v1/realtime 없음

# Cloudflare가 넘긴 실제 사용자 IP(없으면 바로 앞 주소 = cloudflared 컨테이너)
map $http_cf_connecting_ip $posegood_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

upstream posegood_api {
    zone posegood_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    # io-api의 망 별칭(api) — io-api를 다시 만들어도 IP를 다시 찾는다(nginx 1.27.3 이상)
    server api:8090 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # gateway 자체 확인(터널 → gateway 연결). API·DB까지는 /api/health
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # 측정 WebSocket(realtime-ws.v2). 인증은 hello.access_token, 출처는 io-api POSEGOOD_REALTIME_ALLOWED_ORIGINS
    location = /api/v2/realtime {
        proxy_pass http://posegood_api/v2/realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $posegood_client_ip;
        # 밖에서 붙여 온 내부 토큰 헤더는 지운다 — 인터넷에서 내부 전용 기능을 부르지 못하게(지우지 말 것)
        proxy_set_header X-PoseGood-Internal-Token "";
        proxy_read_timeout 120s;
    }

    # REST API — /api 접두사를 떼고 넘긴다. CORS(사전 확인 OPTIONS 포함)는 io-api가 답한다(POSEGOOD_CORS_ALLOWED_ORIGINS)
    location /api/ {
        proxy_pass http://posegood_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $posegood_client_ip;
        proxy_set_header X-PoseGood-Internal-Token "";
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # 그 밖의 경로(화면 파일, 처리 서비스 운영 경로 등)는 내지 않는다
    location / {
        return 404;
    }
}
