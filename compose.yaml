name: ${POSEGOOD_PROJECT_NAME:-posegood}

services:
  db:
    image: mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    restart: unless-stopped
    environment:
      # Schema V1.1 names its database; init scripts apply database/ on an empty volume only.
      MYSQL_DATABASE: posture_service
      MYSQL_USER: posegood
      MYSQL_PASSWORD_FILE: /run/secrets/spring.datasource.password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      POSEGOOD_DB_INIT_SCHEMA: ${POSEGOOD_DB_INIT_SCHEMA:-true}
    secrets:
      - spring.datasource.password
      - mysql_root_password
      - mysql-backup.cnf
      - mysql-app.cnf
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/initdb:/docker-entrypoint-initdb.d:ro
      - ./database/schema:/posegood-db/schema:ro
      - ./database/seed:/posegood-db/seed:ro
    networks: [private]
    healthcheck:
      test: [CMD, mysql, --defaults-extra-file=/run/secrets/mysql-app.cnf, --batch, --skip-column-names, --execute=SELECT 1, posture_service]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  cep:
    image: ${POSEGOOD_CEP_IMAGE:-posegood-cep:local}
    build:
      context: .
      dockerfile: infra/docker/java.Dockerfile
      target: cep
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8091
      SPRING_PROFILES_ACTIVE: persistent
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      POSEGOOD_REQUIRE_INTERNAL_TOKEN: "true"
    secrets: [posegood.internal-token]
    networks: [private]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8091/health]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  inference:
    image: ${POSEGOOD_INFERENCE_IMAGE:-posegood-inference:local}
    build:
      context: .
      dockerfile: infra/docker/inference.Dockerfile
    restart: unless-stopped
    environment:
      POSEGOOD_REQUIRE_INTERNAL_TOKEN: "true"
      POSEGOOD_INTERNAL_TOKEN_FILE: /run/secrets/posegood.internal-token
    secrets: [posegood.internal-token]
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${POSEGOOD_API_IMAGE:-posegood-api:local}
    build:
      context: .
      dockerfile: infra/docker/java.Dockerfile
      target: api
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8090
      SPRING_PROFILES_ACTIVE: persistent
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/posture_service?connectionTimeZone=UTC
      SPRING_DATASOURCE_USERNAME: posegood
      POSEGOOD_CEP_URL: http://cep:8091
      POSEGOOD_INFERENCE_URL: http://inference:8092
      POSEGOOD_COOKIE_SECURE: ${POSEGOOD_COOKIE_SECURE:-false}
    secrets: [spring.datasource.password, posegood.internal-token]
    depends_on:
      db: {condition: service_healthy}
      cep: {condition: service_healthy}
      inference: {condition: service_healthy}
    networks: [private]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8090/health]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    image: ${POSEGOOD_FRONTEND_IMAGE:-posegood-frontend:local}
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_SERVER_ACCOUNTS: "true"
    restart: unless-stopped
    ports:
      - "${POSEGOOD_BIND_ADDRESS:-127.0.0.1}:${POSEGOOD_HTTP_PORT:-8080}:80"
    depends_on:
      api: {condition: service_healthy}
    networks: [private, public]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  private:
    internal: true
  public:

volumes:
  mysql_data:

secrets:
  spring.datasource.password:
    file: ${POSEGOOD_SECRETS_DIR:-./.cache/compose/secrets}/spring.datasource.password
  mysql_root_password:
    file: ${POSEGOOD_SECRETS_DIR:-./.cache/compose/secrets}/mysql_root_password
  posegood.internal-token:
    file: ${POSEGOOD_SECRETS_DIR:-./.cache/compose/secrets}/posegood.internal-token
  mysql-backup.cnf:
    file: ${POSEGOOD_SECRETS_DIR:-./.cache/compose/secrets}/mysql-backup.cnf
  mysql-app.cnf:
    file: ${POSEGOOD_SECRETS_DIR:-./.cache/compose/secrets}/mysql-app.cnf
